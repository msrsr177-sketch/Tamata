name: Ultimate Universal Android & Web Deployer

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: 🚀 Checkout Code
        uses: actions/checkout@v4

      - name: 🛠️ Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: ☕ Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: 📦 Install Dependencies
        run: |
          npm install --legacy-peer-deps
          npm install -g @capacitor/cli

      - name: 🌐 Build Web Project
        run: |
          npm run build --if-present
          # البحث عن مجلد المخرجات وربطه
          if [ -d "dist" ]; then echo "dist" > web_dir.txt;
          elif [ -d "build" ]; then mv build dist && echo "dist" > web_dir.txt;
          elif [ -d "www" ]; then mv www dist && echo "dist" > web_dir.txt;
          else mkdir dist && echo "index" > dist/index.html && echo "dist" > web_dir.txt;
          fi

      - name: 🤖 Build Android APK
        run: |
          if [ ! -d "android" ]; then
            npm install @capacitor/android
            npx cap add android
          fi
          npx cap sync android
          cd android && chmod +x gradlew && ./gradlew assembleDebug

      # --- الحل الجذري لمشكلة عدم ظهور الملفات ---

      - name: 📤 Upload APK (Search & Upload)
        uses: actions/upload-artifact@v4
        with:
          name: Tamata-Application-APK
          # هذا السطر يبحث في كل المجلدات الفرعية عن أي ملف apk
          path: "**/*.apk" 

      - name: 📤 Upload Web (Search & Upload)
        uses: actions/upload-artifact@v4
        with:
          name: Tamata-Web-Files
          path: ./dist/
          
      - name: 🚀 Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
        if: always()
        with:
          artifact_name: github-pages

name: Universal Ultimate Deployer (Fix All Errors)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: 🚀 Checkout Code
        uses: actions/checkout@v4

      - name: 🛠️ Setup Node.js & Java
        uses: actions/setup-node@v4
        with:
          node-version: 20
      
      - name: ☕ Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: 📦 Install & Build Web
        run: |
          npm install --legacy-peer-deps
          npm run build --if-present
          # توحيد مجلد المخرجات مهما كان اسمه (dist/build/www)
          mkdir -p final_web_assets
          if [ -d "dist" ]; then cp -r dist/* final_web_assets/;
          elif [ -d "build" ]; then cp -r build/* final_web_assets/;
          elif [ -d "www" ]; then cp -r www/* final_web_assets/;
          else echo "<h1>Build Fallback</h1>" > final_web_assets/index.html;
          fi

      - name: 🤖 Build Android APK
        run: |
          npm install @capacitor/android @capacitor/core @capacitor/cli
          if [ ! -d "android" ]; then npx cap add android; fi
          # إجبار كاباسيتور على استخدام مجلد المخرجات الموحد
          npx cap sync android
          cd android && chmod +x gradlew && ./gradlew assembleDebug --no-daemon

      # --- الحل العبقري للمسارات المفقودة ---

      - name: 📤 Upload Any Found APK
        uses: actions/upload-artifact@v4
        with:
          name: Download-Your-APK
          path: "**/build/outputs/apk/debug/*.apk" # بحث عميق عن الـ APK

      - name: 🌐 Upload Web for Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: final_web_assets/ # نستخدم المجلد الموحد الذي أنشأناه

      - name: 🚀 Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
