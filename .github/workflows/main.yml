name: Ultimate Universal Android & Web Deployer

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: 🚀 Checkout Code
        uses: actions/checkout@v4

      - name: 🛠️ Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: ☕ Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: 📦 Install Dependencies
        run: |
          npm install --legacy-peer-deps
          npm install -g @capacitor/cli

      - name: 🌐 Build Web Project
        run: |
          npm run build --if-present
          # البحث عن مجلد المخرجات وربطه
          if [ -d "dist" ]; then echo "dist" > web_dir.txt;
          elif [ -d "build" ]; then mv build dist && echo "dist" > web_dir.txt;
          elif [ -d "www" ]; then mv www dist && echo "dist" > web_dir.txt;
          else mkdir dist && echo "index" > dist/index.html && echo "dist" > web_dir.txt;
          fi

      - name: 🤖 Build Android APK
        run: |
          if [ ! -d "android" ]; then
            npm install @capacitor/android
            npx cap add android
          fi
          npx cap sync android
          cd android && chmod +x gradlew && ./gradlew assembleDebug

      # --- الحل الجذري لمشكلة عدم ظهور الملفات ---

      - name: 📤 Upload APK (Search & Upload)
        uses: actions/upload-artifact@v4
        with:
          name: Tamata-Application-APK
          # هذا السطر يبحث في كل المجلدات الفرعية عن أي ملف apk
          path: "**/*.apk" 

      - name: 📤 Upload Web (Search & Upload)
        uses: actions/upload-artifact@v4
        with:
          name: Tamata-Web-Files
          path: ./dist/
          
      - name: 🚀 Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
        if: always()
        with:
          artifact_name: github-pages
