name: Universal Auto Deploy (Web & APK)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build-process:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Install Dependencies
        run: npm install --legacy-peer-deps

      - name: Build Web Project
        run: |
          # محاولة بناء المشروع وتحديد مجلد المخرجات تلقائياً
          npm run build || true
          # التأكد من وجود مجلد المخرجات (dist أو build أو www)
          if [ -d "dist" ]; then echo "Folder dist exists";
          elif [ -d "build" ]; then mv build dist;
          elif [ -d "www" ]; then mv www dist;
          else mkdir dist && echo "<html><body>Fallback</body></html>" > dist/index.html;
          fi

      - name: Build Android APK
        run: |
          # تنصيب كاباسيتور أندرويد إذا مفقود
          npm install @capacitor/android
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          
          # تعديل ملف الإعدادات ليقرأ من dist دائماً
          sed -i 's/"webDir": ".*"/"webDir": "dist"/' capacitor.config.json || true
          
          npx cap sync android
          cd android && chmod +x gradlew && ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Tamata-App
          path: android/app/build/outputs/apk/debug/app-debug.apk
